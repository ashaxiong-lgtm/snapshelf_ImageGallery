<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snapshelf — Photo Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Set theme before paint to avoid a flash */
    (function () {
      var t = localStorage.getItem("theme");
      if (["light", "dark", "blue"].indexOf(t) < 0) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="top">
    <h1 class="logo">Snapshelf<span>24 frames</span></h1>
    <div class="themes" role="group" aria-label="Colour theme">
      <button data-theme-set="light" aria-pressed="false"><span class="ico" aria-hidden="true">☀</span><span>Light<span class="m"> mode</span></span></button>
      <button data-theme-set="dark" aria-pressed="false"><span class="ico" aria-hidden="true">☾</span><span>Dark<span class="m"> mode</span></span></button>
      <button data-theme-set="blue" aria-pressed="false"><span class="ico" aria-hidden="true">◆</span><span>Blue<span class="m"> mode</span></span></button>
    </div>
  </header>

  <div class="toolbar">
    <nav id="filters" class="filters" aria-label="Categories"></nav>
    <input id="search" type="search" placeholder="Search photos" aria-label="Search photos">
  </div>

  <main>
    <p id="count" class="count" aria-live="polite"></p>
    <section id="grid" class="grid"></section>
    <p id="empty" class="empty" hidden>No photos match. Try another word or category.</p>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="lb-bg" id="lbBg"></div>
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close viewer">&times;</button>
    <div class="lb-wrap">
      <div class="lb-stage" id="stage">
        <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">&#8249;</button>
        <figure class="lb-fig">
          <img id="lbImg" alt="" crossorigin="anonymous">
          <figcaption><strong id="lbTitle"></strong><span id="lbMeta"></span></figcaption>
        </figure>
        <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">&#8250;</button>
      </div>
      <aside class="panel" aria-label="Edit photo">
        <h2>Edit photo</h2>
        <div id="presets" class="presets"></div>
        <div id="sliders" class="sliders"></div>
        <div class="actions">
          <button id="resetBtn" class="act">Reset</button>
          <button id="saveBtn" class="act primary">Download edit</button>
        </div>
        <p id="note" class="note" aria-live="polite"></p>
      </aside>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
